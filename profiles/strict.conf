# strict.conf — the full sandbox set (protect-system=strict)
# Applied by harden.sh as a systemd drop-in.
# ProtectSystem=strict makes the WHOLE filesystem read-only, so harden.sh
# MUST also emit a ReadWritePaths= line for every --allow-write path plus
# a sensible default set (WorkingDirectory, /run, /tmp via PrivateTmp).
#
# MemoryDenyWriteExecute=no — node/bun JIT/WASM need writable+executable
# memory mappings. Setting this to `yes` would break the model server and
# any JS runtime that emits machine code at runtime.
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=read-only
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
MemoryDenyWriteExecute=no
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallArchitectures=native
# ── PLACEHOLDERS (filled by harden.sh) ──────────────────────────────────────
# InaccessiblePaths=<paths>
# ReadWritePaths=<paths>
