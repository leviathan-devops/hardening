name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: shellcheck bats pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run script tests inside a container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ubuntu:24.04 \
            bash -lc 'set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends shellcheck bats python3 python3-pytest ca-certificates
              shellcheck harden.sh rollback.sh
              bats tests/safety.bats
              python3 -m pytest -q tests
            '

  secrets:
    name: redacted secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan full history inside a container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ubuntu:24.04 \
            bash -lc 'set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl tar python3 git
              git config --global --add safe.directory /work
              curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
              tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
              chmod +x /usr/local/bin/gitleaks
              gitleaks detect --source /work --log-opts=--all --redact --report-format json --report-path /tmp/gitleaks.json --exit-code 0 --no-banner
              python3 scripts/redact_gitleaks.py /tmp/gitleaks.json /tmp/secret-scan.json /tmp/secret-scan.txt
              python3 scripts/check_secret_report.py /tmp/secret-scan.json reports/secret-scan.json
            '
